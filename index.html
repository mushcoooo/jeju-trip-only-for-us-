var DCOL=["","#e8665a","#3b8fd9","#3f9c6b"],mv={s:1,x:0,y:0},mP={},mTap=0;
function mapCard(){return '<button class="mapcard" data-map="1" style="background-image:var(--mapimg)"><span>🧭 航海圖・點擊展開</span></button>'}
function mApply(){var vp=document.getElementById("mvp"),mw=document.getElementById("mw"),W=vp.clientWidth,H=vp.clientHeight,w=mw.offsetWidth,h=mw.offsetHeight,sw=w*mv.s,sh=h*mv.s;
mv.x=sw<=W?(W-sw)/2:Math.min(0,Math.max(W-sw,mv.x));mv.y=sh<=H?(H-sh)/2:Math.min(0,Math.max(H-sh,mv.y));
mw.style.setProperty("--s",mv.s);mw.style.transform="translate("+mv.x+"px,"+mv.y+"px) scale("+mv.s+")"}
function mZoom(cx,cy,f){var ns=Math.min(6,Math.max(1,mv.s*f));f=ns/mv.s;mv.x=cx-(cx-mv.x)*f;mv.y=cy-(cy-mv.y)*f;mv.s=ns;mApply()}
function mOpen(){var o=document.getElementById("mapov"),vp=document.getElementById("mvp"),mw=document.getElementById("mw");o.style.display="flex";document.documentElement.style.overflow="hidden";

mv={s:1,x:0,y:0};document.getElementById("mpop").style.display="none";mApply()}
function mClose(){document.getElementById("mapov").style.display="none";document.documentElement.style.overflow=""}

(function(){var vp=document.getElementById("mvp");
vp.addEventListener("pointerdown",function(e){mP[e.pointerId]={x:e.clientX,y:e.clientY};mTap=0});
